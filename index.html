<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentació ACAMPA</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="presentation-container"></div>

    <!-- Barra de control inferior (estil original) -->
    <div class="controls">
        <div class="controls-hints">
            <span>←→ navegar</span> · <span>F pantalla completa</span> · <span>Home inici</span>
        </div>
        <div class="controls-buttons">
            <button onclick="goToSlide(0)" title="Anar a l'inici">⏮</button>
            <button onclick="changeSlide(-1)" title="Diapositiva anterior">◀</button>
            <span id="slide-counter" class="slide-counter">1 / 1</span>
            <button onclick="changeSlide(1)" title="Diapositiva següent">▶</button>
            <button onclick="goToSlide(presentationData.slides.length - 1)" title="Anar al final">⏭</button>
            <button onclick="toggleFullscreen()" title="Pantalla completa">⛶</button>
        </div>
    </div>

    <!-- Ordre de càrrega: primer les dades, després la lògica -->
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
